name: SPC4 obstructed friend scan v3

on:
  push:
    branches: [spc4-compute-20260806]
    paths:
      - '.github/workflows/spc4-obstructed-friend-scan-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spc4-compute-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --upgrade requests
      - name: Extract, patch, and run preserved scanner
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          source = Path('.github/workflows/spc4-obstructed-friend-scan.yml').read_text()
          blocks = re.findall(r"python - <<'PY'\n(.*?)\n\s*PY", source, flags=re.S)
          program = textwrap.dedent(max(blocks, key=len))
          replacements = {
              "r['base_crossings'], r['friend_crossings'], r['base_knot'], r['friend_name']))":
                  "r['base_crossings'], r['friend_crossings'], str(r.get('base_knot') or ''), str(r.get('friend_name') or '')))",
              "r['base_knot'], r['friend_name']))":
                  "str(r.get('base_knot') or ''), str(r.get('friend_name') or '')))",
              "x['base_crossings'], x['best_friend_crossings'], x['base_knot']))":
                  "x['base_crossings'], x['best_friend_crossings'], str(x.get('base_knot') or '')))",
              "'friends': sorted((r.get('name') for r in rows if r.get('name'))),":
                  "'friends': sorted((str(r.get('name')) for r in rows if r.get('name'))),",
              "accepted = sorted({k for r in rows for k in r['_nonzero_accepted']})":
                  "accepted = sorted({k for r in rows for k in r['nonzero_accepted']})",
          }
          for old, new in replacements.items():
              if old not in program:
                  print('warning: patch target absent:', old)
              program = program.replace(old, new)
          Path('/tmp/obstructed_scan.py').write_text(program)
          print('scanner lines', len(program.splitlines()))
          PY
          rm -rf research-output/spc4/obstructed_friend_scan
          mkdir -p research-output/spc4/obstructed_friend_scan/pd
          python /tmp/obstructed_scan.py
      - name: Commit results
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'SPC4 research automation'
          git config user.email 'actions@users.noreply.github.com'
          git add research-output/spc4/obstructed_friend_scan
          git commit -m 'Preserve corrected obstructed zero-friend scan'
          git pull --rebase origin spc4-compute-20260806
          git push origin HEAD:spc4-compute-20260806
