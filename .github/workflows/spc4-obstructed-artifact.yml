name: SPC4 obstructed-friend artifact

on:
  push:
    branches: [spc4-compute-20260806]
    paths:
      - '.github/workflows/spc4-obstructed-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spc4-compute-20260806
      - uses: actions/upload-artifact@v4
        with:
          name: obstructed-friend-scan-${{ github.run_id }}
          path: research-output/spc4/obstructed_friend_scan/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
